<body>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VBC70S7YHN"></script>
  <script>
    var host = window.location.origin;
    if (!host.includes("local")) {
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-VBC70S7YHN');
    }
  </script>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-bar" id="scrollProgress"></div>

  <!-- Custom Cursor (desktop only) -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <app-root></app-root>

  <!-- Tab visibility title change -->
  <script>
    var hidden, visibilityChange;
    if (typeof document.hidden !== "undefined") {
      hidden = "hidden";
      visibilityChange = "visibilitychange";
    } else if (typeof document.msHidden !== "undefined") {
      hidden = "msHidden";
      visibilityChange = "msvisibilitychange";
    } else if (typeof document.webkitHidden !== "undefined") {
      hidden = "webkitHidden";
      visibilityChange = "webkitvisibilitychange";
    }

    function handleVisibilityChange() {
      if (document[hidden]) {
        document.title = "Come back! ✨ Kavin's Portfolio";
      } else {
        document.title = "Kavinkumar M | Angular Developer · Next.js Developer";
      }
    }
    document.addEventListener(visibilityChange, handleVisibilityChange, false);

    // Scroll progress bar
    window.addEventListener('scroll', function() {
      var scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight));
      var bar = document.getElementById('scrollProgress');
      if (bar) bar.style.transform = 'scaleX(' + scrolled + ')';
    });

    // Custom cursor (desktop only)
    if (window.matchMedia('(hover: hover)').matches) {
      var dot = document.getElementById('cursorDot');
      var ring = document.getElementById('cursorRing');
      var mouseX = 0, mouseY = 0;
      var ringX = 0, ringY = 0;
      var cursorMoved = false;

      document.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!cursorMoved) {
          cursorMoved = true;
          ringX = mouseX;
          ringY = mouseY;
          if (dot) dot.classList.add('is-visible');
          if (ring) ring.classList.add('is-visible');
        }
        if (dot) { dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px'; }
      });

      function animRing() {
        ringX += (mouseX - ringX) * 0.12;
        ringY += (mouseY - ringY) * 0.12;
        if (ring) { ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px'; }
        requestAnimationFrame(animRing);
      }
      animRing();

      document.querySelectorAll('a, button, [data-cursor]').forEach(function(el) {
        el.addEventListener('mouseenter', function() { if (ring) ring.classList.add('hovering'); });
        el.addEventListener('mouseleave', function() { if (ring) ring.classList.remove('hovering'); });
      });
    }
  </script>
</body>

</html>
