<nav class="navbar" [class.scrolled]="isScrolled" [class.menu-open]="menuOpen" role="navigation" aria-label="Main navigation">
  <!-- Scroll progress line inside nav -->
  <div class="nav-scroll-line" [style.width]="scrollProgress + '%'"></div>

  <div class="nav-container">
    <!-- Brand -->
    <a class="nav-brand" href="#introduction" (click)="scrollTo('introduction', $event)" aria-label="Go to top">
      <span class="brand-icon">
        <span class="brand-letter">K</span>
      </span>
      <span class="brand-name">
        <span class="brand-first">Kavin</span><span class="brand-last">kumar</span>
      </span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="nav-links" role="list">
      <li *ngFor="let section of sections">
        <a class="nav-link" [class.active]="activeSection === section.id"
           [attr.href]="'#' + section.id" (click)="scrollTo(section.id, $event)">
          {{ section.label }}
          <span class="nav-link-underline"></span>
        </a>
      </li>
      <li><a class="nav-link" href="/seo">SEO Work</a></li>
    </ul>

    <!-- CTA Button (desktop) -->
    <a class="nav-cta" href="mailto:kavinkumar025&#64;gmail.com?subject=Regarding%20Job%20Opportunity"
       target="_blank" aria-label="Hire me via email">
      <i class="fa-solid fa-paper-plane"></i>
      Hire Me
    </a>

    <div class="theme-control" data-theme-control role="group" aria-label="Colour theme" hidden>
        <button class="theme-switch" data-theme-toggle type="button" role="switch" aria-label="Dark theme" aria-checked="false" title="Switch between light and dark">
          <span aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></span><span aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 15A9 9 0 0 1 9 3.5 9 9 0 1 0 20.5 15Z"/></svg></span>
        </button>
        <button class="theme-auto" data-theme-auto type="button" aria-pressed="true" title="Follow local time">Auto</button>
      </div>

    <!-- Mobile toggle -->
    <button #menuToggle class="nav-toggle" type="button" (click)="toggleMenu()"
      [class.active]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-navigation" [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'">
      <span class="bar bar-1"></span>
      <span class="bar bar-2"></span>
      <span class="bar bar-3"></span>
    </button>
  </div>

  <!-- Mobile Backdrop -->
  <button type="button" class="nav-backdrop" [class.open]="menuOpen"
    (click)="closeMenu(true)" aria-label="Close navigation menu" tabindex="-1" [attr.aria-hidden]="!menuOpen">
  </button>

  <!-- Mobile Drawer -->
  <div #menuDrawer id="mobile-navigation" class="mobile-drawer" [class.open]="menuOpen"
       role="dialog" [attr.aria-modal]="menuOpen ? 'true' : null" aria-label="Mobile navigation" [attr.aria-hidden]="!menuOpen" [attr.inert]="menuOpen ? null : ''">
    <div class="mobile-drawer-header">
      <span class="mobile-brand">Kavinkumar M</span>
      <button class="drawer-close" type="button" (click)="closeMenu(true)" aria-label="Close menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <ul class="mobile-nav-list" role="list">
      <li *ngFor="let section of sections; let i = index"
          [style.animation-delay]="(i * 0.06) + 's'">
        <a class="mobile-nav-link" [class.active]="activeSection === section.id"
           [attr.href]="'#' + section.id" (click)="scrollTo(section.id, $event)">
          <span class="mobile-nav-num">0{{ i + 1 }}</span>
          {{ section.label }}
          <i class="fa-solid fa-arrow-right mobile-nav-arrow"></i>
        </a>
      </li>
      <li><a class="mobile-nav-link" href="/seo">SEO Work</a></li>
    </ul>
    <div class="mobile-drawer-footer">
      <a href="mailto:kavinkumar025&#64;gmail.com" class="mobile-hire-btn" (click)="closeMenu()">
        <i class="fa-solid fa-paper-plane"></i>
        Get In Touch
      </a>
    </div>
  </div>
</nav>
