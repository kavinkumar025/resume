<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    <a class="nav-brand" href="#introduction" (click)="scrollTo('introduction', $event)">
      <span class="brand-icon">K</span>
      <span class="brand-text">Kavin</span>
    </a>
    <button class="nav-toggle" type="button" (click)="toggleMenu()" [class.active]="menuOpen"
      [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <button type="button" class="nav-backdrop" [class.open]="menuOpen" (click)="closeMenu()"
      aria-label="Close navigation menu"></button>
    <ul class="nav-links" [class.open]="menuOpen">
      <li *ngFor="let section of sections">
        <a class="nav-link" [class.active]="activeSection === section.id"
           [attr.href]="'#' + section.id" (click)="scrollTo(section.id, $event)">
          {{ section.label }}
        </a>
      </li>
    </ul>
  </div>
</nav>
