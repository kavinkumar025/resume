<section class="hero" id="introduction">
  <div class="hero-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>
  <div class="hero-content">
    <div class="hero-text">
      <div class="hero-badge" data-aos="fade-down" data-aos-delay="100">
        <span class="badge-dot"></span>
        Available for opportunities
      </div>
      <h1 class="hero-title" data-aos="fade-up" data-aos-delay="200">
        Hi, I'm <span class="highlight">Kavinkumar M</span>
      </h1>
      <div class="hero-role" data-aos="fade-up" data-aos-delay="300">
        <span #textContainer class="typewriter"></span><span class="cursor">|</span>
      </div>
      <p class="hero-description" data-aos="fade-up" data-aos-delay="400">
        Passionate Angular Developer with <strong>{{ experience }}+ years</strong> of hands-on experience
        crafting dynamic, high-performance web applications.
      </p>
      <div class="hero-actions" data-aos="fade-up" data-aos-delay="500">
        <a class="btn-primary-custom" target="_blank"
           href="mailto:kavinkumar025&#64;gmail.com?subject=Regarding%20Job%20Opportunity">
          <i class="fa-solid fa-paper-plane"></i>
          Recruit Me
        </a>
        <a class="btn-outline-custom" (click)="downloadPDF()">
          <i class="fa-solid fa-download"></i>
          Download CV
        </a>
      </div>
      <div class="hero-socials" data-aos="fade-up" data-aos-delay="600">
        <a href="https://www.linkedin.com/in/kavinkumar-m-17511b20a/" target="_blank" class="social-link" title="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
        <a (click)="openWhatsApp()" class="social-link" title="WhatsApp">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://github.com/kavinkumar025/resume" target="_blank" class="social-link" title="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://instagram.com/im_kavin__25" target="_blank" class="social-link" title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </div>
    <div class="hero-image" data-aos="zoom-in" data-aos-delay="400">
      <div class="image-wrapper">
        <div class="image-ring"></div>
        <img src="assets/images/img4.jpg" alt="Kavinkumar M" />
        <div class="image-glow"></div>
      </div>
      <div class="floating-card card-1" data-aos="fade-left" data-aos-delay="700">
        <i class="fa-brands fa-angular"></i>
        <span>Angular Expert</span>
      </div>
      <div class="floating-card card-2" data-aos="fade-right" data-aos-delay="800">
        <i class="fa-solid fa-code"></i>
        <span>{{ experience }}+ Years</span>
      </div>
    </div>
  </div>
</section>
